services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seoul_mens_daily_edit}
      POSTGRES_USER: ${POSTGRES_USER:-seoul_mens_daily_edit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-seoul_mens_daily_edit}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-seoul_mens_daily_edit}
      DRY_RUN: "true"
      LOG_LEVEL: INFO
      TIMEZONE: Asia/Seoul
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
